name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: amd64
          - arch: arm64
            msvc_arch: amd64_arm64

    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache
          variant: sccache

      - name: Detect package version
        id: package_meta
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'set\(CPACK_PACKAGE_VERSION "([^"]+)"\)'
          if (-not $match) { throw "CPACK_PACKAGE_VERSION not found in CMakeLists.txt" }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DX88000M_FETCH_SDL3=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_C_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --target X88000M --parallel

      - name: Package
        shell: cmd
        run: |
          mkdir package
          copy /Y build\X88000M.exe package\
          xcopy /E /I /Y build\fonts package\fonts
          powershell -NoProfile -Command "Compress-Archive -Path 'package\*' -DestinationPath 'build\X88000M-${{ steps.package_meta.outputs.version }}-windows-${{ matrix.arch }}.zip'"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: X88000M-${{ steps.package_meta.outputs.version }}-windows-${{ matrix.arch }}.zip
          path: build/X88000M-${{ steps.package_meta.outputs.version }}-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: build/X88000M-${{ steps.package_meta.outputs.version }}-windows-${{ matrix.arch }}.zip
