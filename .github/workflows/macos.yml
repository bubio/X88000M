name: macOS Universal Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install dependencies
        run: brew install ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Detect package version
        id: package_meta
        run: |
          echo "version=$(sed -n 's/^set(CPACK_PACKAGE_VERSION \"\\(.*\\)\")/\\1/p' CMakeLists.txt | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DX88000M_FETCH_SDL3=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --target X88000M --parallel

      - name: Verify universal binary
        run: |
          lipo -info build/X88000M.app/Contents/MacOS/X88000M
          otool -l build/X88000M.app/Contents/MacOS/X88000M | grep -A3 LC_BUILD_VERSION

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/X88000M.app \
            build/X88000M-${{ steps.package_meta.outputs.version }}-macos-universal2.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: X88000M-${{ steps.package_meta.outputs.version }}-macos-universal2.zip
          path: build/X88000M-${{ steps.package_meta.outputs.version }}-macos-universal2.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: build/X88000M-${{ steps.package_meta.outputs.version }}-macos-universal2.zip
