name: macOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DX88000M_FETCH_SDL3=ON

      - name: Build
        run: cmake --build build --target X88000M --parallel

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/X88000M.app \
            build/X88000M-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: X88000M-macos
          path: build/X88000M-macos.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: build/X88000M-macos.zip
